name: Deploy demo to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
    contents: read
    pages: write
    id-token: write

# 同一时间只跑一个部署, 新的会取消进行中的
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            # package-lock.json 未提交, 用 npm install
            - name: Install deps
              run: npm install

            # 构建库(dist/index.umd.js) + 主题(dist/index.css) + 示例站点(docs)
            - name: Build
              run: npm run deploy

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
